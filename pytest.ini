[pytest]
# pytest runs ALONGSIDE `python run_all_tests.py`, not instead of it. The runner
# remains canonical: it drives every entry as a subprocess and forces UTF-8 on
# the children, which a cp1256 console once needed to stop a fully-passing test
# file being reported as a failure.

testpaths = . tooth_segmentation/tests

# Directories that must never be collected:
#   Aligner_App_AI_Export  a generated copy of the whole tree, including a
#                          second copy of every test file — pytest imports both
#                          and fails with "import file mismatch"
#   _archive               dead code; test_stl_parser.py there loads server.py
#                          by RELATIVE path and raises FileNotFoundError
#   ToothGroupNetwork      vendored third party, not ours to test
#   frontend, node_modules, .venv, dist, ssr_out — not Python
norecursedirs =
    Aligner_App_AI_Export
    _archive
    ToothGroupNetwork
    frontend
    node_modules
    .venv
    __pycache__
    exports
    segmented

# test_picking*.py are interactive PyQt6 + VTK click-picking experiments for the
# legacy desktop shell. They open real windows and wait for input, so they can
# never run unattended. They are orphans in run_all_tests.py too.
collect_ignore = test_picking.py test_picking2.py
addopts = --ignore=test_picking.py --ignore=test_picking2.py

# Marker vocabulary for the CI split in §21: the AI path needs a 64MB checkpoint
# and minutes of inference, and must not gate a fast build.
markers =
    slow: takes minutes (real-scan geometry)
    ai: requires the ToothGroupNetwork checkpoint
