<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Cyber Intercept</title>
    <style>
        /* Base Reset & Typography */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Consolas', 'Courier New', monospace;
        }

        body, html {
            height: 100%;
            width: 100%;
            background-color: #050508;
            color: #00f3ff;
            overflow: hidden;
        }

        /* Ambient Cyber Background */
        .ambient-grid {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 1;
        }

        /* App Container */
        #appContainer {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            width: 100%;
            background: radial-gradient(circle at center, transparent 0%, #000 100%);
        }

        /* Panels (UI Screens) */
        .panel {
            background: rgba(10, 15, 25, 0.85);
            border: 1px solid #00f3ff;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.1), inset 0 0 15px rgba(0, 243, 255, 0.1);
            border-radius: 4px;
            padding: 30px;
            width: 500px;
            max-width: 95%;
            display: none;
            flex-direction: column;
            gap: 20px;
            position: relative;
            backdrop-filter: blur(5px);
        }

        .panel::before, .panel::after {
            content: ''; position: absolute; width: 20px; height: 20px; border: 2px solid #00f3ff;
        }
        .panel::before { top: -2px; left: -2px; border-right: none; border-bottom: none; }
        .panel::after { bottom: -2px; right: -2px; border-left: none; border-top: none; }

        .active-panel { display: flex; animation: boot-up 0.5s ease-out forwards; }

        h2 {
            text-align: center;
            letter-spacing: 3px;
            text-shadow: 0 0 8px #00f3ff;
            font-size: 22px;
            border-bottom: 1px dashed rgba(0, 243, 255, 0.5);
            padding-bottom: 15px;
            margin-bottom: 10px;
        }

        .input-group { display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 12px; color: #88c0d0; }
        
        input[type="text"] {
            background: rgba(0, 20, 30, 0.6);
            border: 1px solid rgba(0, 243, 255, 0.3);
            color: #fff;
            padding: 12px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
        }
        input[type="text"]:focus { border-color: #00f3ff; box-shadow: 0 0 10px rgba(0,243,255,0.4); }

        input[type="file"] {
            background: rgba(0, 20, 30, 0.6);
            border: 1px dashed #00f3ff;
            padding: 10px;
            color: #00f3ff;
            width: 100%;
            cursor: pointer;
        }

        button.hack-btn {
            background: rgba(0, 243, 255, 0.1);
            color: #00f3ff;
            border: 1px solid #00f3ff;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s;
            margin-top: 10px;
        }
        button.hack-btn:hover { background: #00f3ff; color: #000; box-shadow: 0 0 20px #00f3ff; }

        .terminal-box { background: #000; padding: 15px; border: 1px solid #333; font-size: 12px; }
        .progress-bar { height: 10px; width: 100%; background: #111; margin-top: 10px; border: 1px solid #00f3ff; }
        .progress-fill { height: 100%; width: 0%; background: #00f3ff; box-shadow: 0 0 10px #00f3ff; }

        /* CHAT INTERFACE */
        #chatPanel {
            width: 700px;
            height: 90vh;
            padding: 0;
            background: #020202;
        }

        .chat-header {
            background: #00111a;
            border-bottom: 1px solid #00f3ff;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            color: #fff;
        }
        .chat-header .status { color: #ff0055; text-shadow: 0 0 5px #ff0055; animation: pulse 1.5s infinite; }

        .chat-body {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* CYBERSECURITY VIDEO VAULT */
        .video-vault {
            display: flex;
            flex-direction: row;
            background: #000b13;
            border: 2px solid #00f3ff;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.15) inset;
            border-radius: 8px;
            margin: 10px 0;
            position: relative;
            overflow: hidden;
            width: 100%;
        }

        .video-vault::after {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background-image: linear-gradient(rgba(0, 243, 255, 0.1) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 243, 255, 0.1) 1px, transparent 1px);
            background-size: 15px 15px;
            pointer-events: none;
            z-index: 1;
        }

        .encryption-sidebar {
            width: 45px;
            background: #000;
            color: #00f3ff;
            font-size: 10px;
            line-height: 12px;
            overflow: hidden;
            word-break: break-all;
            padding: 5px;
            z-index: 2;
            text-align: center;
            opacity: 0.8;
        }

        .video-container {
            flex-grow: 1;
            padding: 15px;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        .video-container span.tag {
            color: #ff0055;
            font-size: 11px;
            margin-bottom: 10px;
            border: 1px solid #ff0055;
            padding: 2px 8px;
            align-self: flex-start;
            background: rgba(255,0,85,0.1);
        }

        /* Bulletproof Video CSS */
        video {
            width: 100%;
            height: auto;
            max-height: 400px;
            object-fit: contain;
            border: 1px solid rgba(0,243,255,0.5);
            background: #050505;
            outline: none;
            box-shadow: 0 0 15px rgba(0,243,255,0.2);
            display: block;
        }

        .msg {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 14px;
            color: #e0e0e0;
            position: relative;
            z-index: 5;
        }
        .msg.left { align-self: flex-start; background: #111; border: 1px solid #333; border-bottom-left-radius: 4px; }
        .msg.right { align-self: flex-end; background: #003344; border: 1px solid #00f3ff; border-bottom-right-radius: 4px; }
        .msg-name { font-size: 11px; font-weight: bold; color: #88c0d0; margin-bottom: 5px; }

        @keyframes boot-up { 0% { opacity: 0; filter: blur(10px); transform: scale(0.9); } 100% { opacity: 1; filter: blur(0); transform: scale(1); } }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

    </style>
</head>
<body>

    <div class="ambient-grid"></div>

    <div id="appContainer">
        
        <!-- SCREEN 1 -->
        <div id="configPanel" class="panel active-panel">
            <h2>DECRYPT_UI_V4</h2>
            <div class="input-group">
                <label>TARGET NODE A (Sender)</label>
                <input type="text" id="userA" placeholder="@username_1">
            </div>
            <div class="input-group">
                <label>TARGET NODE B (Receiver)</label>
                <input type="text" id="userB" placeholder="@username_2">
            </div>
            <div class="input-group">
                <label>INJECT MEDIA PAYLOAD (Select Video File)</label>
                <input type="file" id="videoFile" accept="video/*">
            </div>
            <button class="hack-btn" onclick="startHack()">Execute Intercept</button>
            <p id="errorMsg" style="color: #ff0055; font-size: 12px; text-align: center; display: none;">Error: Payload (Video) required.</p>
        </div>

        <!-- SCREEN 2 -->
        <div id="loadingPanel" class="panel">
            <h2>BYPASSING FIREWALL</h2>
            <div class="terminal-box">
                <p id="termLine1">> Establishing secure tunnel...</p>
                <p id="termLine2" style="color: #555;">> Waiting for handshake...</p>
                <div class="progress-bar"><div class="progress-fill" id="pBar"></div></div>
            </div>
        </div>

        <!-- SCREEN 3 -->
        <div id="chatPanel" class="panel">
            <div class="chat-header">
                <span id="chatTitle">INTERCEPTED COMMS</span>
                <span class="status">LIVE RECORDING RECIEVED</span>
            </div>
            <div class="chat-body" id="chatArea">
                <!-- Javascript injects the vault here -->
            </div>
        </div>

    </div>

    <script>
        let u1 = "";
        let u2 = "";
        let videoUrl = "";
        let videoType = "";

        function startHack() {
            const userAInput = document.getElementById('userA').value.trim();
            const userBInput = document.getElementById('userB').value.trim();
            const fileInput = document.getElementById('videoFile');
            const errorMsg = document.getElementById('errorMsg');

            u1 = userAInput || "Target_1";
            u2 = userBInput || "Target_2";

            if (fileInput.files.length === 0) {
                errorMsg.style.display = "block";
                return;
            }

            errorMsg.style.display = "none";
            const file = fileInput.files[0];
            
            // Capture specific file type (e.g., video/mp4) to prevent browser rendering errors
            videoType = file.type || "video/mp4"; 
            videoUrl = URL.createObjectURL(file);

            document.getElementById('configPanel').classList.remove('active-panel');
            document.getElementById('loadingPanel').classList.add('active-panel');

            let prog = 0;
            const pBar = document.getElementById('pBar');
            const line2 = document.getElementById('termLine2');
            
            const hackInterval = setInterval(() => {
                prog += Math.floor(Math.random() * 15) + 5;
                if (prog >= 100) prog = 100;
                pBar.style.width = prog + "%";

                if (prog > 30) line2.innerText = "> Decrypting AES packets...";
                if (prog > 60) line2.innerText = "> Rendering media payload...";
                if (prog > 90) line2.innerText = "> Access Granted. Opening stream.";

                if (prog === 100) {
                    clearInterval(hackInterval);
                    setTimeout(openChat, 600);
                }
            }, 300);
        }

        function openChat() {
            document.getElementById('loadingPanel').classList.remove('active-panel');
            document.getElementById('chatPanel').classList.add('active-panel');
            document.getElementById('chatTitle').innerText = `${u1} ↔ ${u2}`;

            const chatArea = document.getElementById('chatArea');

            // CRITICAL FIX: Added 'muted playsinline' to bypass browser autoplay blocks
            chatArea.innerHTML = `
                <div class="msg left">
                    <div class="msg-name">${u1}</div>
                    I managed to get the raw footage. I'm uploading it through the encrypted channel now.
                </div>
                
                <div class="msg right">
                    <div class="msg-name">${u2}</div>
                    Copy that. Let me know when the transfer is complete so I can wipe the logs.
                </div>

                <div class="video-vault">
                    <div class="encryption-sidebar" id="sideLeft"></div>
                    
                    <div class="video-container">
                        <span class="tag">[!] DECRYPTED VIDEO ASSET</span>
                        <video id="interceptedVideo" controls autoplay loop muted playsinline>
                            <source src="${videoUrl}" type="${videoType}">
                            Your browser does not support HTML5 video.
                        </video>
                    </div>

                    <div class="encryption-sidebar" id="sideRight"></div>
                </div>

                <div class="msg left">
                    <div class="msg-name">${u1}</div>
                    Transfer complete. Did it come through on your end?
                </div>
            `;

            // CRITICAL FIX: Force the browser engine to load the injected video tag
            setTimeout(() => {
                const vid = document.getElementById('interceptedVideo');
                if(vid) vid.load();
            }, 100);

            generateSideCodes();
        }

        function generateSideCodes() {
            const sideLeft = document.getElementById('sideLeft');
            const sideRight = document.getElementById('sideRight');
            if (!sideLeft || !sideRight) return;

            setInterval(() => {
                let code1 = "";
                let code2 = "";
                for(let i=0; i<30; i++) {
                    code1 += Math.random() > 0.5 ? "0" : "1";
                    code2 += Math.floor(Math.random()*16).toString(16).toUpperCase();
                }
                
                sideLeft.innerHTML = code2 + "<br>" + sideLeft.innerHTML;
                sideRight.innerHTML = code1 + "<br>" + sideRight.innerHTML;

                if(sideLeft.innerHTML.length > 800) sideLeft.innerHTML = sideLeft.innerHTML.substring(0, 800);
                if(sideRight.innerHTML.length > 800) sideRight.innerHTML = sideRight.innerHTML.substring(0, 800);

            }, 100);
        }
    </script>
</body>
</html>
